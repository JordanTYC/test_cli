<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b10" />
    <meta name="description" content="Soie et Venin — jeu d'arène Rive." />
    <title>Soie et Venin</title>
    <link rel="stylesheet" href="src/style.css?v=20261002-entry-1" />
  </head>
  <body>
    <main id="game" class="game" aria-label="Soie et Venin">
      <canvas id="rive-canvas" aria-label="Zone de jeu" tabindex="0"></canvas>
      <div class="topbar" aria-label="Commandes du lecteur">
        <span class="wordmark">SOIE <i>ET</i> VENIN</span>
        <span id="runtime-status" class="status" role="status">CHARGEMENT</span>
        <button id="audio-button" class="audio-button" type="button" hidden>Activer le son</button>
        <button id="fullscreen-button" class="icon-button" type="button" aria-label="Passer en plein écran" title="Plein écran">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" /></svg>
        </button>
      </div>
      <section id="gate" class="gate" aria-live="polite" aria-busy="true">
        <div class="gate-panel">
          <p class="eyebrow">UNE ARÈNE DE SOIE ET DE VENIN</p>
          <h1 id="gate-title">Soie et Venin</h1>
          <p id="gate-message">Préparation du jeu…</p>
          <div id="loading-progress" class="loading-progress">
            <progress id="progress-bar" max="100" aria-label="Téléchargement du jeu"></progress>
            <output id="progress-value" aria-live="off">…</output>
          </div>
          <button id="retry-button" class="primary-button" type="button" hidden>RÉESSAYER</button>
          <button id="enter-button" class="primary-button" type="button" hidden>ENTRER DANS L’ARÈNE</button>
        </div>
      </section>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
    <script src="https://unpkg.com/@rive-app/webgl2@2.44.0/rive.js" defer></script>
    <script src="src/main.js?v=20261002-cutout-1" defer></script>
  </body>
</html>
