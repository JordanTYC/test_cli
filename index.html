<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b10" />
    <meta name="description" content="Soie et Venin — jeu d'arène Rive." />
    <title>Soie et Venin</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <main id="game" class="game" aria-label="Soie et Venin">
      <canvas id="rive-canvas" aria-label="Zone de jeu. Cliquez pour donner le focus au jeu." tabindex="0"></canvas>

      <div class="topbar" aria-label="Commandes du lecteur">
        <span class="wordmark">SOIE <i>ET</i> VENIN</span>
        <span id="runtime-status" class="status" role="status">INITIALISATION</span>
        <button id="fullscreen-button" class="icon-button" type="button" aria-label="Passer en plein écran" title="Plein écran (F11)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" /></svg>
        </button>
      </div>

      <section id="gate" class="gate" aria-live="polite">
        <div class="gate-panel">
          <p class="eyebrow">UNE ARÈNE DE SOIE ET DE VENIN</p>
          <h1 id="gate-title">Préparation du combat</h1>
          <p id="gate-message">Chargement du runtime Rive…</p>
          <div class="gate-actions">
            <button id="play-button" class="primary-button" type="button" disabled>ENTRER DANS L’ARÈNE</button>
            <label class="file-button" for="rive-file">Choisir un fichier .riv</label>
            <input id="rive-file" type="file" accept=".riv,application/octet-stream" />
          </div>
          <p class="gate-hint">Manette : branche-la avant ou après le démarrage. La croix / le stick gauche déplacent Hornet.</p>
        </div>
      </section>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
    <script src="https://unpkg.com/@rive-app/webgl2@2.44.0/rive.js"></script>
    <script src="src/main.js" defer></script>
  </body>
</html>
